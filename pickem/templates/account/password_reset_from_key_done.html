{% extends "cfb/base.html" %}
{% load i18n %}

{% block title %}Password Updated | BigPicks{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body space-y-4">
            <h1 class="card-title text-2xl">{% trans "Password updated" %}</h1>
            <p class="text-sm text-base-content/70">
                {% trans "Your password has been changed. You can sign in with it now." %}
            </p>
            <a href="{% url 'account_login' %}" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt mr-2"></i> {% trans "Sign In" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
