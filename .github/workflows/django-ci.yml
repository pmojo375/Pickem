name: Django CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pmojo375
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: pickem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmojo375 -d pickem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-key-for-tests
      DB_PASSWORD: ci-test-password
      POSTHOG_API_KEY: ""
      SENTRY_DSN: ""
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: pickem

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install psycopg2-binary

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test cfb --noinput --verbosity 2
